[project]
name = "gridtrace-api"
version = "0.1.0"
description = "GridTrace authoritative operational API (FastAPI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "geoalchemy2>=0.16.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "orjson>=3.10.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "shapely>=2.0.0",
    "gridtrace-domain",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]

[tool.uv.sources]
gridtrace-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridtrace_api"]
