[project]
name = "gridtrace-ml-lab"
version = "0.1.0"
description = "GridTrace ML lab: experimentation, training, evaluation, and explainability for NTL detection."
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4",
    "catboost>=1.2",
    "lightgbm>=4.0",
    "shap>=0.45",
    "polars>=1.0",
    "pandas>=2.0",
    "numpy",
    "pyarrow>=15.0",
    "click>=8.1",
    "joblib>=1.3",
    "gridtrace-domain",
    "gridtrace-worker",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv.sources]
gridtrace-domain = { workspace = true }
gridtrace-worker = { workspace = true }

[project.scripts]
gridtrace-ml = "gridtrace_ml.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridtrace_ml"]
