[project]
name = "gridtrace-worker"
version = "0.1.0"
description = "GridTrace background worker: synthetic data generation, feature engineering, and risk scoring."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.16",
    "shapely>=2.0",
    "polars>=1.0",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "httpx>=0.27.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "shap>=0.45",
    "apscheduler>=3.10",
    "gridtrace-domain",
    "gridtrace-api",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "momentfm @ git+https://github.com/moment-timeseries-foundation-model/moment.git",
    "numpy>=2.0",
]
dev = [
    "pytest>=8.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
ml = [
    "torch>=2.2",
    "momentfm @ git+https://github.com/moment-timeseries-foundation-model/moment.git",
    "numpy>=2.0",
]

[tool.uv.sources]
gridtrace-domain = { workspace = true }
gridtrace-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridtrace_worker"]

[tool.hatch.metadata]
allow-direct-references = true
