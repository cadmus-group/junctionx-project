[project]
name = "gridtrace-worker"
version = "0.1.0"
description = "GridTrace background worker: synthetic data generation, feature engineering, and risk scoring."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.16",
    "shapely>=2.0",
    "polars>=1.0",
    "numpy",
    "pandas",
    "apscheduler>=3.10",
    "gridtrace-domain",
    "gridtrace-api",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv.sources]
gridtrace-domain = { workspace = true }
gridtrace-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridtrace_worker"]
