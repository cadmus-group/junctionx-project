# GridTrace full stack — PostgreSQL/PostGIS, API, worker, web, ML lab.
#
# Quick start:
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose run --rm worker seed          # first-time demo data
#   docker compose run --rm worker ingest-dutch-energy   # optional Stedin/Liander context
#
# URLs (host):
#   Web  http://localhost:3000
#   API  http://localhost:8000/docs

name: gridtrace

x-python-env: &python-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://gridtrace:gridtrace@postgres:5432/gridtrace
    ASYNC_DATABASE_URL: postgresql+asyncpg://gridtrace:gridtrace@postgres:5432/gridtrace
    DATA_RAW_PATH: /app/data/raw
    DATA_PROCESSED_PATH: /app/data/processed
    MODEL_ARTIFACT_PATH: /app/apps/ml-lab/artifacts

x-data-volumes: &data-volumes
  volumes:
    - ./data/raw:/app/data/raw
    - ./data/processed:/app/data/processed
    - ./data/fixtures:/app/data/fixtures:ro
    - ./apps/ml-lab/artifacts:/app/apps/ml-lab/artifacts

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: gridtrace-postgres
    environment:
      POSTGRES_USER: gridtrace
      POSTGRES_PASSWORD: gridtrace
      POSTGRES_DB: gridtrace
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gridtrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridtrace -d gridtrace"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: gridtrace-migrate
    <<: [*python-env, *data-volumes]
    entrypoint: ["/entrypoint-migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: gridtrace-api
    <<: [*python-env, *data-volumes]
    environment:
      DATABASE_URL: postgresql://gridtrace:gridtrace@postgres:5432/gridtrace
      ASYNC_DATABASE_URL: postgresql+asyncpg://gridtrace:gridtrace@postgres:5432/gridtrace
      DATA_RAW_PATH: /app/data/raw
      DATA_PROCESSED_PATH: /app/data/processed
      MODEL_ARTIFACT_PATH: /app/apps/ml-lab/artifacts
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: gridtrace-worker
    <<: [*python-env, *data-volumes]
    command: ["scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://demotiles.maplibre.org/style.json}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    container_name: gridtrace-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ml-lab:
    build:
      context: .
      dockerfile: infra/docker/ml-lab.Dockerfile
    container_name: gridtrace-ml-lab
    <<: [*python-env, *data-volumes]
    entrypoint: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gridtrace-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    profiles: ["redis"]

volumes:
  gridtrace_pgdata:
