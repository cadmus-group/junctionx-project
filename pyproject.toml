[project]
name = "gridtrace-workspace"
version = "0.1.0"
description = "GridTrace Python workspace (api, worker, ml-lab)"
requires-python = ">=3.11"
readme = "README.md"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "apps/ml-lab", "packages/domain-py"]

[tool.uv.sources]
gridtrace-api = { workspace = true }
gridtrace-worker = { workspace = true }
gridtrace-ml = { workspace = true }
gridtrace-domain = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/alembic/versions/*", "**/.venv/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "apps/worker/tests", "apps/ml-lab/tests"]
markers = [
    "ml: tests requiring optional ML dependencies (torch, momentfm, duckdb)",
]
